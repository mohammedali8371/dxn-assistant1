# لم يعد هذا المشروع يُنشر على Render بعد الآن — يُشغَّل على VPS (Daytona)
# لا تضع أي أسرار هنا
services:
  - type: web
    name: dxn-assistant1
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: PHONE
        sync: false
      - key: SESSION_ENC
        sync: false
      - key: SESSION_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: FIREBASE_KEY
        sync: false
      - key: EXTRA_ACCESS_TOKEN
        sync: false
      - key: ASSISTANT_NAME
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: PORT
        value: 10000
